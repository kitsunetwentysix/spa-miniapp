<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spa-вечер для двоих</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: одна колонка-«меню салона» при свечах, внизу закреплённый чек с общим временем */
:root {
  --bg: #1d1420;        /* тёмная слива, вечер */
  --panel: #2a1d2e;
  --line: #463349;
  --fg: #f3e6ec;
  --muted: #b9a2b0;
  --rose: #e9a3b8;      /* пудровая роза */
  --glow: #f2c48d;      /* свет свечи */
  --on-rose: #2a1420;
  --display: "Cormorant Garamond", "Georgia", serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--body); font-size: 15px; line-height: 1.55;
  padding-inline: 16px; padding-block: 0 140px;
  background:
    radial-gradient(60rem 30rem at 85% -10%, color-mix(in srgb, var(--glow) 14%, transparent), transparent 70%),
    radial-gradient(40rem 30rem at -10% 30%, color-mix(in srgb, var(--rose) 10%, transparent), transparent 70%),
    var(--bg);
  background-attachment: fixed;
}
.wrap { max-width: 720px; margin: 0 auto; }
header { padding-block: 48px 24px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--glow); font-weight: 600; }
h1 { font-family: var(--display); font-weight: 500; font-size: clamp(40px, 9vw, 64px); line-height: 1.02; margin: 10px 0 14px; text-wrap: balance; }
h1 em { color: var(--rose); }
.lead { color: var(--muted); max-width: 52ch; margin: 0; }


section.cat { margin-top: 36px; }
.cat-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 12px; }
.cat-head h2 { font-family: var(--display); font-weight: 600; font-size: 28px; margin: 0; }
.cat-head span { color: var(--muted); font-size: 13px; }

.items { display: grid; gap: 10px; }
.item {
  display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: start;
  padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel) 80%, transparent);
  cursor: pointer; transition: border-color .2s, background .2s, transform .2s;
}
.item:hover { border-color: color-mix(in srgb, var(--rose) 60%, var(--line)); }
.item:has(input:checked) { border-color: var(--rose); background: color-mix(in srgb, var(--rose) 12%, var(--panel)); }
.item:has(input:focus-visible) { outline: 2px solid var(--glow); outline-offset: 2px; }
.item input { position: absolute; opacity: 0; pointer-events: none; }
.tick { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--muted); margin-top: 2px; display: grid; place-items: center; transition: .2s; }
.item:has(input:checked) .tick { background: var(--rose); border-color: var(--rose); }
.tick svg { width: 12px; height: 12px; opacity: 0; }
.item:has(input:checked) .tick svg { opacity: 1; }
.name { font-weight: 600; }
.desc { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.min { font-variant-numeric: tabular-nums; color: var(--glow); font-size: 13px; white-space: nowrap; padding-top: 2px; }
.badge { display: inline-block; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--on-rose); background: var(--rose); border-radius: 99px; padding: 1px 7px; margin-left: 6px; vertical-align: 2px; font-weight: 700; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 99px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--glow); color: var(--on-rose); border-color: var(--glow); font-weight: 600; }
.chip:focus-visible, button:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

.field { display: grid; gap: 6px; margin-top: 14px; }
.field label { font-size: 13px; color: var(--muted); }
textarea, select { width: 100%; font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
textarea { min-height: 90px; resize: vertical; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
}
.bar-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 14px; justify-content: space-between; }
.sum { min-width: 0; }
.sum b { font-family: var(--display); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sum small { display: block; color: var(--muted); font-size: 12.5px; }
.btn { border: 0; border-radius: 99px; padding: 13px 22px; font: inherit; font-weight: 700; background: var(--rose); color: var(--on-rose); cursor: pointer; white-space: nowrap; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }

.ticket { margin-top: 40px; border: 1px solid var(--rose); border-radius: 20px; padding: 24px 20px; background: var(--panel); }
.ticket h2 { font-family: var(--display); font-size: 34px; font-weight: 500; margin: 0 0 4px; }
.ticket .meta { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
.flow { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; }
.flow li { display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding: 10px 0; border-top: 1px dashed var(--line); }
.flow time { font-variant-numeric: tabular-nums; color: var(--glow); font-weight: 600; }
.note { margin-top: 14px; font-style: italic; font-family: var(--display); font-size: 19px; color: var(--rose); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.status { color: var(--muted); font-size: 13px; margin-top: 10px; min-height: 1.2em; }
#copybox { width: 100%; margin-top: 10px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 420px) { .btn { padding: 12px 16px; } .sum b { font-size: 22px; } }
/* Внутри Telegram кнопку заменяет нативная MainButton */
body.tg .bar .btn { display: none; }
body.tg { padding-block-end: 90px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Домашний салон · только для тебя</div>
    <h1>Spa-вечер <em>для двоих</em></h1>
    <p class="lead">Отметь процедуры, которые хочешь сегодня. Я соберу из них программу вечера по времени и всё подготовлю. Можно выбрать сколько угодно.</p>
  </header>

  <div id="menu"></div>

  <section class="cat" aria-labelledby="h-aroma">
    <div class="cat-head"><h2 id="h-aroma">Аромат вечера</h2><span>одно масло для лампы</span></div>
    <div class="chips" id="aromas"></div>
  </section>

  <section class="cat" aria-labelledby="h-wish">
    <div class="cat-head"><h2 id="h-wish">Детали</h2><span>по желанию</span></div>
    <div class="field">
      <label for="start">Во сколько начинаем</label>
      <select id="start">
        <option>18:00</option><option>18:30</option><option selected>19:00</option><option>19:30</option><option>20:00</option><option>20:30</option><option>21:00</option>
      </select>
    </div>
    <div class="field">
      <label for="wish">Особые пожелания</label>
      <textarea id="wish" placeholder="Например: массаж посильнее, а музыку потише"></textarea>
    </div>
  </section>

  <div id="ticketWrap"></div>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="sum"><b id="total">0 мин</b><small id="count">Пока ничего не выбрано</small></div>
    <button class="btn" id="done" disabled>Записаться</button>
  </div>
</div>

<script>
const MENU = [
  { cat: "Атмосфера", note: "с этого начнём", items: [
    { id: "candles", name: "Свечи и приглушённый свет", desc: "Чайные свечи по всей комнате", min: 0, hit: true },
    { id: "playlist", name: "Спокойный плейлист", desc: "Лаунж, джаз или звуки дождя", min: 0 },
    { id: "bath", name: "Ванна с пеной и лепестками роз", desc: "Тёплая вода около 38 °C, бокал рядом", min: 30, hit: true },
  ]},
  { cat: "Лицо", note: "уход и расслабление", items: [
    { id: "steam", name: "Очищение и паровая ванночка", desc: "Тёплое полотенце, мягкая пенка", min: 10 },
    { id: "mask", name: "Маска для лица", desc: "Тканевая или глиняная, пока мы болтаем", min: 20, hit: true },
    { id: "patches", name: "Патчи под глаза", desc: "Охлаждённые в холодильнике", min: 15 },
    { id: "gua", name: "Массаж лица роллером", desc: "Лёгкие движения от центра к вискам", min: 10 },
  ]},
  { cat: "Тело", note: "главное блюдо", items: [
    { id: "back", name: "Массаж спины и плеч", desc: "С тёплым маслом, без спешки", min: 30, hit: true },
    { id: "scrub", name: "Скраб для тела", desc: "Кофейный или сахарный, в душе", min: 15 },
    { id: "fullbody", name: "Расслабляющий массаж всего тела", desc: "Для тех, кто хочет растаять", min: 45 },
  ]},
  { cat: "Руки и ноги", note: "маленькие радости", items: [
    { id: "footbath", name: "Ванночка для ног", desc: "Морская соль и пара капель масла", min: 15 },
    { id: "foot", name: "Массаж стоп", desc: "После ванночки, с кремом", min: 15, hit: true },
    { id: "hands", name: "Уход за руками", desc: "Скраб, крем и массаж ладоней", min: 15 },
    { id: "nails", name: "Покрою ногти лаком", desc: "Цвет выбираешь ты, аккуратность обещаю", min: 25 },
  ]},
  { cat: "Волосы", note: "", items: [
    { id: "hairmask", name: "Маска для волос", desc: "Под полотенцем, пока идут другие процедуры", min: 20 },
    { id: "head", name: "Массаж головы", desc: "Медленно, кончиками пальцев", min: 10 },
  ]},
  { cat: "Угощения", note: "между процедурами", items: [
    { id: "berries", name: "Клубника и шоколад", desc: "Растоплю шоколад для фондю", min: 0, hit: true },
    { id: "wine", name: "Бокал игристого", desc: "Или безалкогольное, если захочешь", min: 0 },
    { id: "tea", name: "Травяной чай", desc: "Мята, ромашка или облепиха", min: 0 },
    { id: "fruit", name: "Фруктовая тарелка", desc: "Нарезанная красиво", min: 0 },
  ]},
];
const AROMAS = ["Лаванда", "Иланг-иланг", "Апельсин", "Сандал", "Роза", "Без аромата"];
const ALL = MENU.flatMap(c => c.items);
const tickSvg = '<svg viewBox="0 0 12 12" fill="none"><path d="M2 6.2 4.8 9 10 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--on-rose)"/></svg>';

const menuEl = document.getElementById("menu");
menuEl.innerHTML = MENU.map((c, i) => `
  <section class="cat" aria-labelledby="h-c${i}">
    <div class="cat-head"><h2 id="h-c${i}">${c.cat}</h2><span>${c.note}</span></div>
    <div class="items">
      ${c.items.map(it => `
        <label class="item" for="p-${it.id}">
          <input type="checkbox" id="p-${it.id}" value="${it.id}">
          <span class="tick">${tickSvg}</span>
          <span><span class="name">${it.name}</span>${it.hit ? '<span class="badge">хит</span>' : ''}<div class="desc">${it.desc}</div></span>
          <span class="min">${it.min ? it.min + " мин" : "фоном"}</span>
        </label>`).join("")}
    </div>
  </section>`).join("");

let aroma = "Лаванда";
const aromasEl = document.getElementById("aromas");
function drawAromas() {
  aromasEl.innerHTML = AROMAS.map(a => `<button type="button" class="chip" aria-pressed="${a === aroma}">${a}</button>`).join("");
}
aromasEl.addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) { aroma = b.textContent; drawAromas(); } });
drawAromas();

function chosen() { return ALL.filter(it => document.getElementById("p-" + it.id).checked); }
function plural(n, a, b, c) { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; }
function fmt(min) { const h = Math.floor(min / 60), m = min % 60; return h ? `${h} ч ${m ? m + " мин" : ""}`.trim() : `${m} мин`; }

function updateBar() {
  const sel = chosen();
  const total = sel.reduce((s, it) => s + it.min, 0);
  document.getElementById("total").textContent = fmt(total);
  document.getElementById("count").textContent = sel.length
    ? `${sel.length} ${plural(sel.length, "процедура", "процедуры", "процедур")} в программе`
    : "Пока ничего не выбрано";
  document.getElementById("done").disabled = !sel.length;
}
menuEl.addEventListener("change", updateBar);

// Порядок вечера: атмосфера → ванна → лицо/волосы → тело → руки/ноги; угощения идут фоном
const ORDER = ["candles","playlist","bath","steam","hairmask","mask","patches","gua","scrub","back","fullbody","head","footbath","foot","hands","nails"];
function buildPlan() {
  const sel = chosen();
  const [hh, mm] = document.getElementById("start").value.split(":").map(Number);
  let t = hh * 60 + mm;
  const timed = ORDER.map(id => sel.find(s => s.id === id)).filter(Boolean);
  const steps = timed.map(it => { const at = t; t += it.min; return { at, it }; });
  const treats = sel.filter(s => !ORDER.includes(s.id));
  return { steps, treats, end: t, wish: document.getElementById("wish").value.trim() };
}
const clock = m => `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
function planText(p) {
  const lines = ["Мой spa-вечер 💆‍♀️", `Аромат: ${aroma}`, ""];
  p.steps.forEach(s => lines.push(`${clock(s.at)} — ${s.it.name}`));
  if (p.treats.length) lines.push("", "Угощения: " + p.treats.map(t => t.name.toLowerCase()).join(", "));
  lines.push("", `Финал около ${clock(p.end)}`);
  if (p.wish) lines.push("", "Пожелания: " + p.wish);
  return lines.join("\n");
}

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tg = window.Telegram?.WebApp;
const inTelegram = !!(tg && tg.initData);
let currentText = "";
let planShown = false;

function showPlan() {
  const p = buildPlan();
  currentText = planText(p);
  planShown = true;
  const wrap = document.getElementById("ticketWrap");
  wrap.innerHTML = `
    <div class="ticket" id="ticket">
      <div class="eyebrow">Почти готово</div>
      <h2>Твоя программа</h2>
      <div class="meta">Аромат: ${esc(aroma)} · с ${clock(p.steps[0]?.at ?? 0)} до ${clock(p.end)}</div>
      <ul class="flow">
        ${p.steps.map(s => `<li><time>${clock(s.at)}</time><span>${esc(s.it.name)}</span></li>`).join("")}
        ${p.treats.length ? `<li><time>весь вечер</time><span>${esc(p.treats.map(t => t.name).join(", "))}</span></li>` : ""}
      </ul>
      ${p.wish ? `<div class="note">«${esc(p.wish)}»</div>` : ""}
      <div class="actions">
        ${inTelegram ? "" : '<button class="btn" id="copy">Скопировать текст</button>'}
        <button class="btn ghost" id="edit">Изменить выбор</button>
      </div>
      <div class="status" id="status">${inTelegram ? "Нажми «Отправить» внизу, и я получу твой выбор." : ""}</div>
      <textarea id="copybox" readonly hidden></textarea>
    </div>`;
  document.getElementById("ticket").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  document.getElementById("edit").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
  const copy = document.getElementById("copy");
  if (copy) copy.onclick = async () => {
    const st = document.getElementById("status");
    try { await navigator.clipboard.writeText(currentText); st.textContent = "Скопировано."; }
    catch { const box = document.getElementById("copybox"); box.hidden = false; box.value = currentText; box.select(); st.textContent = "Выдели текст ниже и скопируй вручную."; }
  };
  syncMainButton();
}

// Отправка боту. Работает, только если Mini App открыт кнопкой под полем ввода (reply-клавиатура)
function sendToBot() {
  const p = buildPlan();
  const payload = JSON.stringify({
    text: planText(p),
    procedures: [...p.steps.map(s => s.it.id), ...p.treats.map(t => t.id)],
    aroma, start: document.getElementById("start").value,
  });
  tg.HapticFeedback?.notificationOccurred("success");
  tg.sendData(payload); // после этого Telegram сам закроет приложение
}

function syncMainButton() {
  if (!inTelegram) return;
  const n = chosen().length;
  if (!n) { tg.MainButton.hide(); return; }
  tg.MainButton.setParams({
    text: planShown ? "Отправить 💌" : `Собрать программу (${n})`,
    color: "#e9a3b8", text_color: "#2a1420", is_visible: true, is_active: true,
  });
}

document.getElementById("done").addEventListener("click", showPlan);
menuEl.addEventListener("change", () => {
  planShown = false;
  document.getElementById("ticketWrap").innerHTML = "";
  tg?.HapticFeedback?.selectionChanged();
  syncMainButton();
});

if (inTelegram) {
  document.body.classList.add("tg");
  tg.ready();
  tg.expand();
  tg.setHeaderColor?.("#1d1420");
  tg.setBackgroundColor?.("#1d1420");
  tg.MainButton.onClick(() => (planShown ? sendToBot() : showPlan()));
}
updateBar();
</script>
</body>
</html>
